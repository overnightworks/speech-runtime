[gate]
mandatory_jobs = ["Speech: lint, tests", "Speech: Chatterbox provider", "Speech: Qwen provider", "Speech: VoxCPM provider", "Speech: Magpie provider"]

[[root.allow]]
entry = "packages/"
reason = "the uv workspace's member distributions"

[[root.allow]]
entry = "providers/"
reason = "the GPU and CPU speech providers, each its own uv project with its own lock"

[[python.allow]]
path = "providers/magpie/pyproject.toml"
reason = "several locked packages have no cp314 wheel; its C3 slice moves it after one GPU run"

[[python.allow]]
path = "providers/provider-contract/pyproject.toml"
reason = "Magpie imports it on 3.12, so it keeps >=3.12 until its C3 slice moves it"

[[layout.allow]]
path = "providers/chatterbox/tests/test_worker.py"
rule = "test-layout"
reason = "it tests the provider contract, a sibling project with no tests of its own"

# providers/chatterbox/uv.lock: advisories no relock reaches
