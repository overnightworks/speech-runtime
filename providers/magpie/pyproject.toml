[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "presentator-magpie-provider"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub",
    "nemo-toolkit[tts]==3.0.0",
    "numpy",
    "omegaconf",
    "presentator-speech-provider-contract",
    "torch",
]

[project.scripts]
presentator-magpie-worker = "presentator_magpie.__main__:main"

[tool.uv.sources]
presentator-speech-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/presentator_magpie"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D103", "INP001", "PLC0415", "S101", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "D103", "D107", "ANN001", "PLR2004"]
"src/presentator_magpie/__main__.py" = ["PLC0415"]
"src/presentator_magpie/model.py" = ["PLC0415", "TC003"]
