[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-magpie-provider"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub",
    "nemo-toolkit[tts]==3.0.0",
    "numpy",
    "omegaconf",
    "overnightworks-speech-runtime-provider-contract",
    "torch",
]

[project.scripts]
speech-runtime-magpie-worker = "speech_runtime_magpie.__main__:main"

[tool.uv]
# nemo-text-processing 1.2.0 pins pynini==2.1.6.post1, which has no cp314 wheel
override-dependencies = ["pynini==2.1.7"]

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_magpie"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest checks with assert
    "D103", # the test name states the behaviour
]

[tool.ruff.lint.flake8-tidy-imports]
# The model library stays unloaded until the worker holds the model.
banned-module-level-imports = ["speech_runtime_magpie.model"]
