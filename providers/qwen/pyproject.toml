[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-qwen-provider"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.4",
    "overnightworks-speech-runtime-provider-contract",
    "qwen-tts==0.1.1",
]

[project.scripts]
speech-runtime-qwen-worker = "speech_runtime_qwen.__main__:main"

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_qwen"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest checks with assert
    "D103", # the test name states the behaviour
]
"src/speech_runtime_qwen/__main__.py" = [
    "PLC0415", # the stdout redirect precedes the provider import, and the tests pin that order
]

[tool.ruff.lint.flake8-tidy-imports]
# The model libraries stay unloaded until the worker holds the model.
banned-module-level-imports = ["huggingface_hub", "qwen_tts", "torch"]
