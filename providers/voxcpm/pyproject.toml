[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-voxcpm-provider"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.4",
    "overnightworks-speech-runtime-provider-contract",
    "voxcpm==2.0.3",
]

[project.scripts]
speech-runtime-voxcpm-worker = "speech_runtime_voxcpm.__main__:main"

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_voxcpm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "ANN001", "PLR2004"]
"src/speech_runtime_voxcpm/__main__.py" = ["PLC0415"]
"src/speech_runtime_voxcpm/model.py" = ["PLC0415"]
