[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "presentator-chatterbox-contract"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.hatch.build.targets.wheel]
packages = ["src/presentator_chatterbox_contract"]

[tool.ruff]
target-version = "py312"
src = ["src", "../chatterbox/src", "../chatterbox/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "BLE001", "COM812", "CPY001", "D103", "INP001", "PLC0415", "S101",
    "SIM105", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "D103", "D107", "ANN001", "PLR2004"]
