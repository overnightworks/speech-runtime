[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-provider-contract"
version = "0.0.0"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_provider_contract"]

[tool.ruff]
target-version = "py312"
src = ["src", "../chatterbox/src", "../chatterbox/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["BLE001", "COM812", "CPY001", "SIM105"]
