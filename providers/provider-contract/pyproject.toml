[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-provider-contract"
version = "0.16.0"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_provider_contract"]

[tool.ruff]
target-version = "py312"
src = ["src", "../qwen/src", "../qwen/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]
