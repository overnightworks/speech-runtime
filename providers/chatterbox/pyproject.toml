[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-chatterbox-provider"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["chatterbox-tts==0.1.7", "numpy==1.26.4", "overnightworks-speech-runtime-provider-contract", "setuptools==81.0.0"]

[project.scripts]
speech-runtime-chatterbox-worker = "speech_runtime_chatterbox.__main__:main"

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_chatterbox"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "PLC0415", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "ANN001"]
