[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-chatterbox-provider"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["chatterbox-tts==0.1.7", "numpy==2.5.4", "overnightworks-speech-runtime-provider-contract", "setuptools==81.0.0"]

[project.scripts]
speech-runtime-chatterbox-worker = "speech_runtime_chatterbox.__main__:main"

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_chatterbox"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest checks with assert
    "D103", # the test name states the behaviour
]

[tool.ruff.lint.flake8-tidy-imports]
# The model libraries stay unloaded until the worker holds the model.
banned-module-level-imports = [
    "speech_runtime_chatterbox.model",
    "chatterbox",
    "huggingface_hub",
    "safetensors",
    "torch",
    "transformers",
]
