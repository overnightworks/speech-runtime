version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-speech:
        update-types: [minor, patch]
        # GPU/model-coupled pins stay single PRs so each lands with its own speech/GPU proof
        exclude-patterns:
          - "nvidia-*"
          - "numpy"
          - "faster-whisper"
          - "piper-tts"
  - package-ecosystem: uv
    directories: ["/providers/chatterbox", "/providers/magpie"]
    schedule:
      interval: weekly
    ignore:
      # nemo-toolkit 3.0.0 caps omegaconf at 2.3; drop this once nemo-toolkit relaxes the cap
      - dependency-name: "omegaconf"
        versions: [">2.3"]
