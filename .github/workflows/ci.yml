name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speech:
    name: "Speech: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            providers/chatterbox/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q --cov --cov-report=xml:coverage-root.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-root
          path: coverage-root.xml

  chatterbox-provider:
    name: "Speech: Chatterbox provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: providers/chatterbox
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            providers/chatterbox/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/chatterbox pytest -q providers/chatterbox/tests
          --cov --cov-report=xml:coverage-chatterbox.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-chatterbox
          path: coverage-chatterbox.xml

  qwen-provider:
    name: "Speech: Qwen provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: providers/qwen
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: providers/qwen/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/qwen pytest -q providers/qwen/tests/test_main.py providers/qwen/tests/test_model.py
          --cov --cov-report=xml:coverage-qwen.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-qwen
          path: coverage-qwen.xml

  voxcpm-provider:
    name: "Speech: VoxCPM provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: providers/voxcpm
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: providers/voxcpm/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/voxcpm pytest -q providers/voxcpm/tests/test_main.py providers/voxcpm/tests/test_model.py
          --cov --cov-report=xml:coverage-voxcpm.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-voxcpm
          path: coverage-voxcpm.xml

  magpie-provider:
    name: "Speech: Magpie provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: providers/magpie
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: providers/magpie/uv.lock
          version: "0.10.9"
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src
      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src
      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/magpie pytest -q providers/magpie/tests/test_main.py providers/magpie/tests/test_model.py
          --cov --cov-report=xml:coverage-magpie.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-magpie
          path: coverage-magpie.xml

  coverage:
    name: "Speech: coverage reports"
    needs:
      - speech
      - chatterbox-provider
      - qwen-provider
      - voxcpm-provider
      - magpie-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the five coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Upload the coverage reports for the quality gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage-*.xml
          if-no-files-found: error

  quality:
    name: quality
    needs:
      - coverage
      - speech
      - chatterbox-provider
      - qwen-provider
      - voxcpm-provider
      - magpie-provider
    if: always()
    uses: overnightworks/quality/.github/workflows/gate.yml@0512e98cff3190c9bec855e6bc753180ab3aae02 # v0.9.0
    with:
      coverage-artifact: coverage
    permissions:
      contents: read
      actions: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
