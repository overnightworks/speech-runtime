[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-service"
version = "0.0.0"
description = "Local speaking and hearing, one process on the card."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "faster-whisper==1.2.1",
    "huggingface-hub==2.3.0",
    "numpy==2.5.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "piper-tts==1.8.0",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
    "websockets==17.3",
    "overnightworks-speech-runtime-provider-contract",
]

[project.scripts]
speech-runtime-service = "speech_runtime_service.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_service"]

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "providers/provider-contract", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
include = ["src/*", "providers/*/src/*"]

[tool.ruff]
target-version = "py314"
src = [".", "src", "tests"]
# The gate's layout rules forbid package markers in these directories.
namespace-packages = ["scripts", "tests/scripts", "tests/support"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates the route handlers' annotations when it builds the app.
runtime-evaluated-decorators = ["fastapi.FastAPI.get", "fastapi.FastAPI.post"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "D103", "D107", "ANN001", "PLR2004"]
"scripts/**" = [
    "T201",
    "S603",
    "S108",
    "S607",
    "PLR2004",
    "TRY003",
    "EM101",
    "ASYNC109",
    "SIM113",
    # A background thread's failure can be any library error; it is reported by
    # message, not left to hang the join with no diagnostic.
    "BLE001",
]
# nvidia-smi is resolved on PATH; the arguments are a constant.
"src/speech_runtime_service/card.py" = ["S603"]
# A failed load can be any library error; the process still names the model and stops.
"src/speech_runtime_service/service.py" = ["BLE001"]
"src/speech_runtime_service/qwen_download.py" = ["BLE001"] # A provider callback may raise any library error.
# Piper and faster-whisper stay unloaded until the process holds them.
"src/speech_runtime_service/speaking.py" = ["PLC0415"]
"src/speech_runtime_service/provider_process.py" = [
    "S603", "BLE001", "EM101", "SIM105",
    "TC003", "TRY003", "TRY301",
]
"src/speech_runtime_service/hearing.py" = ["PLC0415"]
