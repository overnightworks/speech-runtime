[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-service"
version = "0.0.0"
description = "Local speaking and hearing, one process on the card."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "faster-whisper==1.2.1",
    "huggingface-hub==2.3.0",
    "numpy==2.5.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "piper-tts==1.8.0",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
    "websockets==17.3",
    "overnightworks-speech-runtime-provider-contract",
]

[project.scripts]
speech-runtime-service = "speech_runtime_service.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_service"]

[tool.uv.sources]
overnightworks-speech-runtime-provider-contract = { path = "providers/provider-contract", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
include = ["src/*", "providers/*/src/*"]

[tool.ruff]
target-version = "py314"
src = [".", "src", "tests"]
# The gate's layout rules forbid package markers in these directories.
namespace-packages = ["scripts", "tests/scripts", "tests/support"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates the route handlers' annotations when it builds the app.
runtime-evaluated-decorators = ["fastapi.FastAPI.get", "fastapi.FastAPI.post"]

[tool.ruff.lint.flake8-tidy-imports]
# Piper and faster-whisper stay unloaded until the process holds them.
banned-module-level-imports = ["piper", "faster_whisper"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Asserts are the tests' checks; a test function's name is its documentation.
# The tests start the service and the workers as subprocesses with fixed argv.
"tests/**" = ["S101", "S603", "D103"]
