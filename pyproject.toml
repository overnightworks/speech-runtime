[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-service"
version = "0.2.1"
description = "Local speech synthesis, one process on the card."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "faster-whisper==1.2.1",
    "huggingface-hub==2.4.0",
    "overnightworks-webauth @ git+https://github.com/overnightworks/webauth@v0.31.0",
    "numpy==2.5.4",
    "piper-tts==1.8.0",
    "python-multipart==0.0.32",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
    "overnightworks-speech-runtime-client",
    "overnightworks-speech-runtime-provider-contract",
    "websockets==17.4",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cudnn-cu12==9.27.0.42",
]

[project.scripts]
speech-runtime-service = "speech_runtime_service.__main__:main"
speech-runtime-fetch-hearing-model = "speech_runtime_service.fetch_hearing_model:main"
speech-runtime-fetch-voice = "speech_runtime_service.fetch_voice:main"

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "httpx2==2.16.0",
    "pyjwt[crypto]==2.15.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_service"]

[tool.uv.workspace]
members = ["packages/client"]
exclude = ["providers/*"]

[tool.uv.sources]
overnightworks-speech-runtime-client = { workspace = true }
overnightworks-speech-runtime-provider-contract = { path = "providers/provider-contract", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -m 'not keycloak'"
markers = ["keycloak: needs the CI Keycloak that the keycloak-token-shapes job serves"]
pythonpath = [".", "scripts"]
testpaths = ["tests", "packages/client/tests"]

[tool.coverage.run]
branch = true
relative_files = true
include = ["src/*", "packages/*/src/*", "providers/*/src/*"]

[tool.ruff]
target-version = "py314"
src = [".", "scripts", "src", "packages/client/src", "tests", "packages/client/tests"]
# The gate's layout rules forbid package markers in these directories.
namespace-packages = ["scripts", "tests/scripts", "tests/support", "tests/fixtures/image"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates the route handlers' annotations when it builds the app.
runtime-evaluated-decorators = ["fastapi.FastAPI.get", "fastapi.FastAPI.post"]
# Pydantic resolves the field annotations of its models when the class is built.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-tidy-imports]
# Piper stays unloaded until the process holds it.
banned-module-level-imports = ["piper"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Asserts are the tests' checks; a test function's name is its documentation.
# The tests start the service and the workers as subprocesses with fixed argv.
"tests/**" = ["S101", "S603", "D103"]
"packages/client/tests/**" = ["S101", "D103"]
