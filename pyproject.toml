[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-service"
version = "0.0.0"
description = "Local speech synthesis, one process on the card."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "huggingface-hub==2.3.0",
    "overnightworks-webauth @ https://github.com/overnightworks/webauth/releases/download/v0.26.0/overnightworks_webauth-0.26.0-py3-none-any.whl#sha256=85191c4f41d1c287682f55625a4ad12f574dcc53c523376b48b419a2a469582f",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "piper-tts==1.8.0",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
    "overnightworks-speech-runtime-client",
    "overnightworks-speech-runtime-provider-contract",
]

[project.scripts]
speech-runtime-service = "speech_runtime_service.__main__:main"

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "httpx2==2.16.0",
    "pyjwt[crypto]==2.15.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_service"]

[tool.uv.workspace]
members = ["packages/client"]
exclude = ["providers/*"]

[tool.uv.sources]
overnightworks-speech-runtime-client = { workspace = true }
overnightworks-speech-runtime-provider-contract = { path = "providers/provider-contract", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
include = ["src/*", "packages/*/src/*", "providers/*/src/*"]

[tool.ruff]
target-version = "py314"
src = [".", "scripts", "src", "packages/client/src", "tests"]
# The gate's layout rules forbid package markers in these directories.
namespace-packages = ["scripts", "tests/scripts", "tests/support"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates the route handlers' annotations when it builds the app.
runtime-evaluated-decorators = ["fastapi.FastAPI.get", "fastapi.FastAPI.post"]

[tool.ruff.lint.flake8-tidy-imports]
# Piper stays unloaded until the process holds it.
banned-module-level-imports = ["piper"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Asserts are the tests' checks; a test function's name is its documentation.
# The tests start the service and the workers as subprocesses with fixed argv.
"tests/**" = ["S101", "S603", "D103"]
